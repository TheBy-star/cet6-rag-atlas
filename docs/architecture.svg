<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">CET6 RAG 智能问答助手架构图</title>
  <desc id="desc">离线阶段将个人笔记切分、向量化并存入 ChromaDB；在线阶段检索相关笔记，拼接 Prompt 后调用 DeepSeek，最后由 Streamlit 展示回答和引用来源。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="60" y="52" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#0f172a">CET6 备考 RAG 智能问答助手 · 系统架构</text>
  <text x="60" y="80" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#64748b">个人笔记 → 切分 → BGE 向量化 → ChromaDB → 检索 → DeepSeek → Streamlit</text>

  <!-- Lane 1 -->
  <rect x="40" y="110" width="1120" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="128" width="160" height="28" rx="14" fill="#dbeafe"/>
  <text x="78" y="147" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">① 离线建库</text>
  <text x="232" y="147" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#64748b">把个人笔记变成可检索的本地向量库</text>

  <!-- Boxes lane 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="170" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="260" y="190" width="180" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="470" y="190" width="180" height="78" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <rect x="680" y="190" width="190" height="78" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <rect x="900" y="190" width="220" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  </g>

  <text x="145" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">个人笔记 txt</text>
  <text x="145" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">词汇 / 长难句 / 翻译错题</text>

  <text x="350" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">LangChain 切分</text>
  <text x="350" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">按条目切 · 400 / 80</text>

  <text x="560" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#4c1d95">chunks.jsonl</text>
  <text x="560" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">正文 + source / section</text>

  <text x="775" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#4c1d95">BGE Embedding</text>
  <text x="775" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">bge-small-zh-v1.5 · ONNX</text>

  <text x="1010" y="224" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#9a3412">ChromaDB</text>
  <text x="1010" y="248" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">本地持久化 · 6 条示例</text>

  <!-- Arrows lane 1 -->
  <line x1="230" y1="229" x2="255" y2="229" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="229" x2="465" y2="229" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="229" x2="675" y2="229" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="229" x2="895" y2="229" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lane 2 -->
  <rect x="40" y="330" width="1120" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="60" y="348" width="190" height="28" rx="14" fill="#dcfce7"/>
  <text x="78" y="367" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#15803d">② 在线问答</text>
  <text x="262" y="367" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#64748b">先检索个人笔记，再让大模型基于资料回答</text>

  <!-- Query flow -->
  <g filter="url(#shadow)">
    <rect x="60" y="430" width="150" height="78" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="240" y="430" width="150" height="78" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <rect x="420" y="430" width="150" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="600" y="430" width="150" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="780" y="430" width="150" height="78" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <rect x="960" y="430" width="170" height="78" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
  </g>

  <text x="135" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#166534">用户问题</text>
  <text x="135" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">Streamlit chat_input</text>

  <text x="315" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#4c1d95">BGE Query</text>
  <text x="315" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">问题向量化</text>

  <text x="495" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Top-K 召回</text>
  <text x="495" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">相似度检索 · 3 条</text>

  <text x="675" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Prompt 拼装</text>
  <text x="675" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">资料 + 问题 + 约束</text>

  <text x="855" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#991b1b">DeepSeek API</text>
  <text x="855" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">deepseek-chat</text>

  <text x="1045" y="464" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#155e75">Streamlit 展示</text>
  <text x="1045" y="488" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569">回答 + 引用来源</text>

  <!-- Arrows lane 2 -->
  <line x1="210" y1="469" x2="235" y2="469" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="469" x2="415" y2="469" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="469" x2="595" y2="469" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="469" x2="775" y2="469" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="469" x2="955" y2="469" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retrieval link from ChromaDB to query flow -->
  <path d="M1010 268 L1010 300 L495 300 L495 425" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowOrange)"/>
  <rect x="690" y="286" width="150" height="26" rx="13" fill="#ffedd5"/>
  <text x="765" y="304" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#9a3412">向量检索（查询时）</text>

  <!-- Question also goes to prompt -->
  <path d="M135 508 L135 550 L675 550 L675 512" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="405" y="570" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#1d4ed8">原始问题同时进入 Prompt，避免只靠检索片段</text>

  <!-- Footer -->
  <text x="60" y="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#64748b">数据与向量库保存在本地；只有生成回答时，检索到的片段和问题会发送到 DeepSeek API。</text>
</svg>
